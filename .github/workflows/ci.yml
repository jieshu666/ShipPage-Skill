name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type-check Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Type-check (src/)
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Type-check MCP package
        working-directory: shippage-mcp
        run: |
          npm ci
          npx tsc --noEmit
