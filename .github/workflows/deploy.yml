name: Deploy

# Deploys the Worker to production on every push to main, and on demand.
# Requires one repository secret: CLOUDFLARE_API_TOKEN
#   (Cloudflare dashboard → My Profile → API Tokens → "Edit Cloudflare Workers"
#    template → scoped to the shippage.ai account/zone).
# Until that secret is set, the deploy step is skipped (not failed), so the
# Actions tab stays clean. Once set, production can never silently drift from main.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Skip notice (no token yet)
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set — skipping deploy. Set the repo secret to enable auto-deploy."
      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
