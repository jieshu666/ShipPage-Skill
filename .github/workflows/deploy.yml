name: Deploy

# Deploys the Worker to production on every push to main, and on demand.
# Requires one repository secret: CLOUDFLARE_API_TOKEN
#   (Cloudflare dashboard → My Profile → API Tokens → "Edit Cloudflare Workers"
#    template → scoped to the shippage.ai account/zone).
# Once the secret is set, production can never silently drift from main again.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
